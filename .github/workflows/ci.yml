name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: python -m pip install .
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/ai.js
          node --check web/standards.js
      - name: Frontend tests
        run: node --test tests/test_xiumi_ui.cjs tests/test_frontend.cjs
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Test installed package
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/paper_studio-*.whl
          python tests/smoke_installed.py
