<!doctype html><html><head><meta charset="utf-8"><title>结构测试参考</title></head><body>
<h1 id="activity-name">平台标题，不属于正文设计</h1>
<article id="js_content" style="visibility:hidden;opacity:0;font-size:14px;line-height:1.8;color:#333333">
  <section style="background-color:#fff6f8;padding:13px">
    <section style="padding:0px 20px"><p style="margin:0;text-indent:2em">这是一段足够长的导语，用来辨认原文开场的浅粉色容器与正文卡片并不相同。这里是参考文章的文字，不能进入新的文稿。</p></section>
  </section>
  <section style="background-color:#c70606;padding:16px 0px">
    <section style="display:flex;justify-content:center;margin-bottom:25px">
      <section style="width:94%;background-color:#ffffff;padding:15px">
        <p style="text-align:center;font-size:18px;font-weight:700;margin:0px 0px 16px">第一组参考章节</p>
        <figure style="margin:0px;border:2px solid #c70606"><img data-src="https://example.com/source-photo.jpg" data-ratio="0.56" style="width:100%"></figure>
        <section style="padding:12px 20px;text-align:justify">
          <p style="text-indent:2em;margin:0px 0px 18px">第一组的正文内容足够长，保证它会被识别为正文而不是装饰性的短标题。新稿应当保留周围的白色卡片、红色外框和独立的照片边线。</p>
          <p style="text-indent:2em;margin:0">第二段正文在同一张白色采访卡片里面，不应当被变成一张单独的带背景色的小卡片。这是原文的结构特征。</p>
        </section>
        <section style="display:flex;justify-content:center;margin:20px 0px"><section style="width:8px;height:8px;background-color:#c70606;transform:rotate(45deg)"></section></section>
      </section>
    </section>
    <section style="display:flex;justify-content:center">
      <section style="width:94%;background-color:#ffffff;padding:15px">
        <p style="text-align:center;font-size:18px;font-weight:700;margin:0px 0px 16px">第二组参考章节</p>
        <section style="padding:12px 20px"><p style="text-indent:2em;margin:0">第二组文章的正文继续采用相同的文字样式，但是它处在另一张独立的白色卡片里面，两组内容之间有明确的红色留白。</p></section>
      </section>
    </section>
  </section>
  <section style="text-align:right;color:#999999;font-size:12px"><p>某某 | 编辑</p></section>
</article><script>alert('blocked')</script></body></html>
